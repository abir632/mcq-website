<!DOCTYPE html>
<html>
<head>
  <title>Exam Portal</title>
</head>
<body>

<h2>Exam Portal</h2>
<p>Time Left: <span id="timer">300</span> sec</p>

<form id="examForm">
  <p>1. 2 + 2 = ?</p>
  <input type="radio" name="q1" value="3">3
  <input type="radio" name="q1" value="4">4

  <br><br>
  <button type="button" onclick="submitExam()">Submit</button>
</form>

<div id="result"></div>

<script>
let timeLeft = 300;
let score = 0;

const timer = setInterval(() => {
  timeLeft--;
  document.getElementById("timer").innerText = timeLeft;

  if (timeLeft <= 0) {
    clearInterval(timer);
    submitExam();
  }
}, 1000);

function submitExam() {
  clearInterval(timer);

  let answer = document.querySelector('input[name="q1"]:checked');

  if (answer && answer.value === "4") {
    score++;
  }

  document.getElementById("examForm").style.display = "none";
  document.getElementById("result").innerHTML =
    `<h3>Exam Finished</h3>
     <p>Your Score: ${score}/1</p>`;
}
</script>

</body>
</html>
