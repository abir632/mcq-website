<!DOCTYPE html>
<html>
<head>
  <title>MCQ Exam System</title>
  <style>
    body { font-family: Arial; background:#f4f4f4; text-align:center; }
    .box { background:white; padding:20px; margin:20px auto; width:300px; border-radius:10px; }
    button { padding:10px; margin-top:10px; cursor:pointer; }
    #quiz, #adminPanel, #leaderboard { display:none; }
  </style>
</head>
<body>

<h2>MCQ Exam System</h2>

<!-- LOGIN -->
<div class="box" id="loginBox">
  <input id="username" placeholder="Username"><br><br>
  <input id="password" type="password" placeholder="Login Password"><br><br>
  <button onclick="login()">Login</button>
</div>

<!-- QUIZ -->
<div class="box" id="quiz">
  <h3 id="timer">Time: 60</h3>
  <div id="question"></div>
  <button onclick="next()">Next</button>
</div>

<!-- ADMIN -->
<div class="box" id="adminPanel">
  <h3>Admin Panel</h3>
  <input id="adminPass" type="password" placeholder="Admin Password"><br><br>
  <button onclick="checkAdmin()">Enter</button>
</div>

<!-- LEADERBOARD -->
<div class="box" id="leaderboard">
  <h3>Leaderboard</h3>
  <div id="scores"></div>
</div>

<script>
let users = [];
let score = 0;
let time = 60;
let index = 0;

let questions = [
  {q:"2+2=?", a:"4", options:["3","4","5"]},
  {q:"Capital of Bangladesh?", a:"Dhaka", options:["Dhaka","Delhi","Kolkata"]}
];

function login(){
  let u = document.getElementById("username").value;
  let p = document.getElementById("password").value;

  if(u && p){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("quiz").style.display="block";
    loadQ();
    startTimer();
  }
}

function loadQ(){
  let q = questions[index];
  document.getElementById("question").innerHTML =
    `<h4>${q.q}</h4>` +
    q.options.map(o => `<button onclick="answer('${o}')">${o}</button>`).join("<br>");
}

function answer(ans){
  if(ans === questions[index].a){
    score++;
  }
}

function next(){
  index++;
  if(index < questions.length){
    loadQ();
  } else {
    end();
  }
}

function startTimer(){
  let t = setInterval(()=>{
    time--;
    document.getElementById("timer").innerText = "Time: " + time;
    if(time <= 0){
      clearInterval(t);
      end();
    }
  },1000);
}

function end(){
  alert("Exam Finished! Score: " + score);
  users.push(score);
  document.getElementById("quiz").style.display="none";
  document.getElementById("leaderboard").style.display="block";

  document.getElementById("scores").innerHTML =
    users.map((s,i)=>`User ${i+1}: ${s}`).join("<br>");
}
