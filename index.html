<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exam System</title>
</head>
<body>

<h2>Online Exam</h2>
<p>Time Left: <span id="timer">10:00</span></p>

<form id="examForm">
  <p>1. Capital of Bangladesh?</p>
  <input type="radio" name="q1" value="a"> Dhaka<br>
  <input type="radio" name="q1" value="b"> Chittagong<br>

  <p>2. 2 + 2 = ?</p>
  <input type="radio" name="q2" value="a"> 3<br>
  <input type="radio" name="q2" value="b"> 4<br>

  <br>
  <button type="button" onclick="submitExam()">Submit</button>
</form>

<h3 id="result"></h3>

<script>
let timeLeft = 600; // 10 min

let timer = setInterval(function () {
    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    document.getElementById("timer").innerText =
        minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

    timeLeft--;

    if (timeLeft < 0) {
        clearInterval(timer);
        submitExam();
    }
}, 1000);

function submitExam() {
    clearInterval(timer);

    let score = 0;
    let answers = {
        q1: "a",
        q2: "b"
    };

    for (let q in answers) {
        let selected = document.querySelector(`input[name="${q}"]:checked`);
        if (selected && selected.value === answers[q]) {
            score++;
        }
    }

    document.getElementById("result").innerHTML =
        "Result: " + score + "/" + Object.keys(answers).length +
        "<br>Time Used: " + (600 - timeLeft) + " sec";
}
</script>

</body>
</html>
