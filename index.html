<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCQ Practice Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #3730a3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>MCQ Practice Test</h2>
    <p id="question">Question here</p>
    <div id="options"></div>
    <p id="score"></p>
  </div>  <script>
    const quiz = [
      {
        question: "What is 2 + 2?",
        options: ["3", "4", "5", "6"],
        answer: "4"
      },
      {
        question: "Capital of Bangladesh?",
        options: ["Dhaka", "Chattogram", "Khulna", "Sylhet"],
        answer: "Dhaka"
      }
    ];

    let current = 0;
    let score = 0;

    function loadQuestion() {
      if (current >= quiz.length) {
        document.querySelector('.container').innerHTML = `<h2>Finished!</h2><p>Your Score: ${score}/${quiz.length}</p>`;
        return;
      }

      document.getElementById('question').innerText = quiz[current].question;
      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';

      quiz[current].options.forEach(option => {
        const btn = document.createElement('button');
        btn.innerText = option;
        btn.onclick = () => checkAnswer(option);
        optionsDiv.appendChild(btn);
      });
    }

    function checkAnswer(selected) {
      if (selected === quiz[current].answer) {
        score++;
      }
      current++;
      loadQuestion();
    }

    loadQuestion();
  </script></body>
</html>
