<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science MCQ Quiz</title>
<style>
body {
    <script>
let password = prompt("Enter Admin Password:");

if (password !== "12345") {
    document.write("<h1>Access Denied</h1>");
    throw new Error("Wrong password");
}
</script>
    
    font-family: Arial, sans-serif;
    background: #f0f8ff;
    padding: 20px;
}
.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px gray;
}
button {
    display: block;
    width: 100%;
    margin: 8px 0;
    padding: 10px;
    border: none;
    background: #3498db;
    color: white;
    border-radius: 5px;
}
button:hover {
    background: #2980b9;
}
</style>
</head>
<body>

<div class="container">
    <h1>Science MCQ Quiz</h1>
    
    <p>1. Water boils at?</p>
    <button>50°C</button>
    <button>100°C</button>
    <button>150°C</button>
    <button>200°C</button>

    <p>2. Earth is the ___ planet from the Sun.</p>
    <button>2nd</button>
    <button>3rd</button>
    <button>4th</button>
    <button>5th</button>

    <p>3. Human body has how many bones?</p>
    <button>206</button>
    <button>300</button>
    <button>150</button>
    <button>180</button>
</div>

</body>
</html>
